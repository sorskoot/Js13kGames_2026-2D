<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f9e8f2">
<title>Rainbow Merge</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main id="wrap">
  <header id="hd">
    <div id="brand"><div class="eyebrow">A POCKETFUL OF MAGIC</div><h1><span>Rainbow</span> Merge</h1></div>
    <div id="mascot"><canvas id="goal-art" width="240" height="240" aria-label="A unicorn under a rainbow" role="img"></canvas><span>THE DREAM</span></div>
  </header>
  <div id="toolbar">
    <div id="scores">
      <div class="sc"><span>SCORE</span><b id="score">0</b></div>
      <div class="sc"><span>PERSONAL BEST</span><b id="best">0</b></div>
    </div>
    <button id="new" class="reset" title="New game" aria-label="New game"><span aria-hidden="true">&#8635;</span></button>
  </div>
  <div id="board-shell">
    <canvas id="canvas" tabindex="0" aria-label="Rainbow Merge, 4 by 4 puzzle. Use arrow keys, WASD, or swipe to merge matching gems."></canvas>
    <div id="combo" role="status" aria-live="polite"></div>
  </div>
  <section id="journey" aria-labelledby="journey-title">
    <div id="journey-heading"><h2 id="journey-title">Rainbow Journey</h2><span id="current-color" aria-live="polite">Red <small>1 / 9</small></span></div>
    <ol id="legend"></ol>
  </section>
  <footer id="footer"><span>A little world of wonder</span></footer>
</main>
<canvas id="celebration" aria-hidden="true"></canvas>
<div id="overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="ov-msg" aria-describedby="ov-sub" inert>
  <div id="ov-card">
    <canvas id="win-art" width="400" height="320" role="img" aria-label="A happy unicorn and its rainbow"></canvas>
    <div id="ov-kicker">A LITTLE RAINBOW MAGIC</div>
    <h2 id="ov-msg"></h2>
    <div id="ov-sub"></div>
    <div id="ov-btns">
      <button id="ov-keep" class="hidden">Keep Going</button>
      <button id="ov-new">New Game</button>
    </div>
  </div>
</div>
<script src="b.js"></script>
</body>
</html>
